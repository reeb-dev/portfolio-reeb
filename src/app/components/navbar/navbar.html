<nav class="fixed w-full top-0 z-50 bg-white dark:bg-dark border-b border-[#E2E8F0] dark:border-[#1E293B] backdrop-blur-md bg-opacity-95 dark:bg-opacity-95 transition-colors duration-300">
  <div class="container-custom py-4 flex items-center justify-between">
    <a href="#hero" class="flex items-center gap-4 group">
      <div class="font-brand font-semibold text-4xl tracking-wider transition-colors duration-300" style="letter-spacing: 0.04em;">
        <span class="text-[#020617] dark:text-white">REEB</span><span class="text-[#3B82F6]">.</span>
      </div>
    </a>

    <div class="hidden md:flex items-center gap-8">
      <a href="#experiencia" class="text-sm font-medium text-[#475569] dark:text-[#94A3B8] hover:text-[#3B82F6] dark:hover:text-[#3B82F6] transition-colors">
        {{ i18n.t().nav.experience }}
      </a>
      <a href="#stack" class="text-sm font-medium text-[#475569] dark:text-[#94A3B8] hover:text-[#3B82F6] dark:hover:text-[#3B82F6] transition-colors">
        {{ i18n.t().nav.stack }}
      </a>
      <a href="#about" class="text-sm font-medium text-[#475569] dark:text-[#94A3B8] hover:text-[#3B82F6] dark:hover:text-[#3B82F6] transition-colors">
        {{ i18n.t().nav.about }}
      </a>
      <a href="#services" class="text-sm font-medium text-[#475569] dark:text-[#94A3B8] hover:text-[#3B82F6] dark:hover:text-[#3B82F6] transition-colors">
        {{ i18n.t().nav.services }}
      </a>

      <div class="w-px h-6 bg-[#E2E8F0] dark:bg-[#1E293B]"></div>

      <a href="mailto:manuelreeb@icloud.com" class="text-sm font-medium text-[#475569] dark:text-[#94A3B8] hover:text-[#3B82F6] dark:hover:text-[#3B82F6] transition-colors">
        Email
      </a>
      <a href="https://github.com/reeb-dev" target="_blank" class="text-sm font-medium text-[#475569] dark:text-[#94A3B8] hover:text-[#3B82F6] dark:hover:text-[#3B82F6] transition-colors">
        GitHub
      </a>
      <a href="https://www.linkedin.com/in/manuel-jesus-reeb/" target="_blank" class="text-sm font-medium text-[#475569] dark:text-[#94A3B8] hover:text-[#3B82F6] dark:hover:text-[#3B82F6] transition-colors">
        LinkedIn
      </a>

      <div class="flex items-center text-xs font-semibold tracking-wide">
        <button
          type="button"
          (click)="setLang('es')"
          class="px-1.5 py-1 rounded transition-colors"
          [class.text-[#3B82F6]]="i18n.lang() === 'es'"
          [class.text-[#94A3B8]]="i18n.lang() !== 'es'"
          [attr.aria-pressed]="i18n.lang() === 'es'"
        >ES</button>
        <span class="text-[#CBD5E1]">/</span>
        <button
          type="button"
          (click)="setLang('en')"
          class="px-1.5 py-1 rounded transition-colors"
          [class.text-[#3B82F6]]="i18n.lang() === 'en'"
          [class.text-[#94A3B8]]="i18n.lang() !== 'en'"
          [attr.aria-pressed]="i18n.lang() === 'en'"
        >EN</button>
      </div>

      <button
        (click)="toggleTheme()"
        class="p-2 rounded-lg bg-[#F8FAFC] dark:bg-[#020617] hover:bg-[#E2E8F0] dark:hover:bg-[#1E293B] border border-[#E2E8F0] dark:border-[#1E293B] transition-colors"
        [attr.aria-label]="themeService.isDarkMode() ? i18n.t().nav.themeLight : i18n.t().nav.themeDark"
      >
        <span *ngIf="!themeService.isDarkMode()" class="text-xl">🌙</span>
        <span *ngIf="themeService.isDarkMode()" class="text-xl">☀️</span>
      </button>
    </div>

    <div class="md:hidden flex items-center gap-3">
      <div class="flex items-center text-xs font-semibold tracking-wide">
        <button
          type="button"
          (click)="setLang('es')"
          class="px-1 py-1"
          [class.text-[#3B82F6]]="i18n.lang() === 'es'"
          [class.text-[#94A3B8]]="i18n.lang() !== 'es'"
        >ES</button>
        <span class="text-[#CBD5E1]">/</span>
        <button
          type="button"
          (click)="setLang('en')"
          class="px-1 py-1"
          [class.text-[#3B82F6]]="i18n.lang() === 'en'"
          [class.text-[#94A3B8]]="i18n.lang() !== 'en'"
        >EN</button>
      </div>
      <button
        (click)="toggleTheme()"
        class="p-2 rounded-lg bg-[#F8FAFC] dark:bg-[#020617] hover:bg-[#E2E8F0] dark:hover:bg-[#1E293B] border border-[#E2E8F0] dark:border-[#1E293B] transition-colors"
      >
        <span *ngIf="!themeService.isDarkMode()" class="text-xl">🌙</span>
        <span *ngIf="themeService.isDarkMode()" class="text-xl">☀️</span>
      </button>
      <button
        (click)="toggleMobileMenu()"
        class="p-2 rounded-lg bg-[#F8FAFC] dark:bg-[#020617] hover:bg-[#E2E8F0] dark:hover:bg-[#1E293B] border border-[#E2E8F0] dark:border-[#1E293B] transition-colors"
      >
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path *ngIf="!isMobileMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
          <path *ngIf="isMobileMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>
  </div>

  <div *ngIf="isMobileMenuOpen" class="md:hidden border-t border-[#E2E8F0] dark:border-[#1E293B] bg-white dark:bg-[#020617]">
    <div class="container-custom py-4 space-y-4">
      <a href="#experiencia" (click)="isMobileMenuOpen = false" class="block text-sm font-medium text-[#475569] dark:text-[#94A3B8] hover:text-[#3B82F6] dark:hover:text-[#3B82F6] transition-colors">
        {{ i18n.t().nav.experience }}
      </a>
      <a href="#stack" (click)="isMobileMenuOpen = false" class="block text-sm font-medium text-[#475569] dark:text-[#94A3B8] hover:text-[#3B82F6] dark:hover:text-[#3B82F6] transition-colors">
        {{ i18n.t().nav.stack }}
      </a>
      <a href="#about" (click)="isMobileMenuOpen = false" class="block text-sm font-medium text-[#475569] dark:text-[#94A3B8] hover:text-[#3B82F6] dark:hover:text-[#3B82F6] transition-colors">
        {{ i18n.t().nav.about }}
      </a>
      <a href="#services" (click)="isMobileMenuOpen = false" class="block text-sm font-medium text-[#475569] dark:text-[#94A3B8] hover:text-[#3B82F6] dark:hover:text-[#3B82F6] transition-colors">
        {{ i18n.t().nav.services }}
      </a>

      <div class="pt-4 border-t border-[#E2E8F0] dark:border-[#1E293B] space-y-4">
        <a href="mailto:manuelreeb@icloud.com" class="block text-sm font-medium text-[#475569] dark:text-[#94A3B8] hover:text-[#3B82F6] dark:hover:text-[#3B82F6] transition-colors">
          Email
        </a>
        <a href="https://github.com/reeb-dev" target="_blank" class="block text-sm font-medium text-[#475569] dark:text-[#94A3B8] hover:text-[#3B82F6] dark:hover:text-[#3B82F6] transition-colors">
          GitHub
        </a>
        <a href="https://www.linkedin.com/in/manuel-jesus-reeb/" target="_blank" class="block text-sm font-medium text-[#475569] dark:text-[#94A3B8] hover:text-[#3B82F6] dark:hover:text-[#3B82F6] transition-colors">
          LinkedIn
        </a>
      </div>
    </div>
  </div>
</nav>
